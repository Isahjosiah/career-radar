name: Update opportunities
on:
  schedule:
    - cron: "7 * * * *"   # every hour at minute 7 (UTC)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/fetch_opportunities.py
      - run: |
          git config user.name "career-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/opportunities.json
          git diff --staged --quiet || git commit -m "Hourly update" && git push
